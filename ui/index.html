<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Send a message to every station on the net and watch it arrive.">
<meta name="netcast-token" content="{{token}}">
<title>netcast</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="top">
  <h1>netcast</h1>
  <p class="who" id="who">Connecting to netcast...</p>
  <p class="tnc" id="tnc" role="status"></p>
</header>
<p class="lost" id="lost" role="alert" hidden>Lost contact with netcast. Is it still running?</p>

<main class="grid">
  <section class="send" aria-labelledby="send-h">
    <h2 id="send-h">Send</h2>
    <form id="form" novalidate>
      <fieldset>
        <legend>To</legend>
        <div class="picks" id="members"></div>
        <label class="field" for="extra">Other callsigns or groups</label>
        <input id="extra" autocomplete="off" spellcheck="false" autocapitalize="characters" placeholder="K1ABC, W2XYZ">
        <p class="hint" id="to-hint"></p>
      </fieldset>

      <div class="row">
        <div>
          <label class="field" for="mode">Mode</label>
          <select id="mode">
            <option value="addressed">Addressed: stations confirm</option>
            <option value="bulletin">Bulletin: no replies</option>
            <option value="emergency">Emergency</option>
          </select>
        </div>
        <div>
          <label class="field" for="precedence">Precedence</label>
          <select id="precedence">
            <option value="routine">Routine</option>
            <option value="welfare">Welfare</option>
            <option value="priority">Priority</option>
            <option value="emergency">Emergency</option>
          </select>
        </div>
        <div id="repeat-wrap" hidden>
          <label class="field" for="repeat">Extra passes</label>
          <input id="repeat" type="number" min="0" max="10" value="0" inputmode="numeric">
        </div>
        <div id="interval-wrap" hidden>
          <label class="field" for="interval">Minutes apart</label>
          <input id="interval" type="number" min="1" max="1440" value="10" inputmode="numeric">
        </div>
      </div>
      <label class="check" id="ack-wrap" hidden><input type="checkbox" id="ack"> Ask stations to confirm</label>

      <div class="source" id="source" role="radiogroup" aria-label="Message source" hidden>
        <label class="check"><input type="radio" name="source" value="compose" checked> Write one</label>
        <label class="check"><input type="radio" name="source" value="outbox"> From the outbox</label>
      </div>

      <div id="compose">
        <label class="field" for="subject">Subject</label>
        <input id="subject" maxlength="128" autocomplete="off">
        <label class="field" for="body">Message</label>
        <textarea id="body" rows="9"></textarea>
      </div>
      <div id="pick" hidden>
        <label class="field" for="file">Message</label>
        <select id="file"></select>
        <p class="hint" id="file-hint"></p>
      </div>

      <label class="check"><input type="checkbox" id="sign"> Sign with this station's key</label>
      <p class="hint" id="sign-hint"></p>

      <div class="actions">
        <button type="submit" id="go">Send to the net</button>
        <p class="error" id="form-error" role="alert"></p>
      </div>
    </form>
  </section>

  <section class="air" aria-labelledby="air-h">
    <h2 id="air-h">On the air</h2>
    <div id="air"><p class="empty">Nothing sent yet.</p></div>
  </section>

  <section class="incoming" aria-labelledby="in-h">
    <h2 id="in-h">Incoming</h2>
    <ul class="msgs" id="incoming"></ul>
    <p class="empty" id="incoming-empty">Nothing received yet.</p>
  </section>

  <section class="history" aria-labelledby="history-h">
    <h2 id="history-h">History</h2>
    <div class="history-cols">
      <div>
        <h3>Sent</h3>
        <ul class="msgs" id="sent"></ul>
      </div>
      <div>
        <h3>Received</h3>
        <ul class="msgs" id="received"></ul>
      </div>
    </div>
  </section>

  <section class="log" aria-labelledby="log-h">
    <h2 id="log-h">Log</h2>
    <pre id="log" tabindex="0" aria-label="Station log"></pre>
  </section>
</main>
</body>
</html>
