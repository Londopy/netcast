[package]
name = "netcast"
version = "0.2.0"
edition = "2024"
authors = ["Londopy"]
description = "One-to-many Winlink message delivery for packet radio nets, using RaptorQ fountain codes"
license = "Apache-2.0"
repository = "https://github.com/Londopy/netcast"
homepage = "https://github.com/Londopy/netcast"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
brotli = "9.1.3"
clap = { version = "4.6.8", features = ["derive"] }
ed25519-dalek = "3.0.0"
rand = "0.10.4"
raptorq = "2.0.1"
semver = "1.0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tiny_http = "0.12.0"
toml = "1.2"
ureq = "3.5.2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = true
codegen-units = 1
strip = true

